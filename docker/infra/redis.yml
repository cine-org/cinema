services:
  # Cache and rate limiting. Note allkeys-lru: anything stored here can be evicted.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '512mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    networks: [cinema]
    restart: unless-stopped
