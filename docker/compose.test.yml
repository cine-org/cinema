name: cinema-test

volumes:
  postgres_test_data:
    name: cinema-test-postgres-data

networks:
  cinema_test:
    name: cinema-test-net
    driver: bridge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_TEST_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-cinema_test}
    command:
      - postgres
      - -c
      - max_connections=${POSTGRES_TEST_MAX_CONNECTIONS:-50}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_TEST_USER:-postgres} -d ${POSTGRES_TEST_DB:-cinema_test}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '${POSTGRES_TEST_PORT:-5433}:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./infra/postgres/roles.sql:/roles.sql:ro
    # Applies roles on every start, so existing volumes pick up new roles too; roles.sql is idempotent.
    # Waits on TCP: the temporary server initdb runs listens on the socket only.
    post_start:
      - command: >-
          sh -c 'until pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -q; do sleep 1; done;
          psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /roles.sql'
    networks:
      - cinema_test
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # No volume: test cache state should never survive a run.
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${REDIS_TEST_PORT:-6380}:6379'
    networks:
      - cinema_test
    restart: unless-stopped
