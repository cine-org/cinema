name: Docker Build and Push
description: Resolve Dockerfile, generate Docker metadata, build and push one app image.

inputs:
  app:
    description: App image name.
    required: true
  registry:
    description: Container registry.
    required: true
  owner:
    description: Repository owner or organization.
    required: true
  repo:
    description: Repository name.
    required: true
  tags:
    description: docker/metadata-action tag rules.
    required: true
  registry-username:
    description: Registry login username.
    required: false
    default: ''
  registry-password:
    description: Registry login password.
    required: false
    default: ''
  push:
    description: Whether to push the built image.
    required: false
    default: 'true'
  turbo-token:
    description: Turborepo remote cache token.
    required: false
    default: ''
  turbo-team:
    description: Turborepo remote cache team.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Resolve Dockerfile
      id: dockerfile
      shell: bash
      run: |
        if [[ "${{ inputs.app }}" == "migrator" ]]; then
          echo "path=packages/database/migrator/Dockerfile" >> "$GITHUB_OUTPUT"
        else
          echo "path=apps/${{ inputs.app }}/Dockerfile" >> "$GITHUB_OUTPUT"
        fi

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      if: inputs.push == 'true'
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: ${{ inputs.registry }}/${{ inputs.owner }}/${{ inputs.repo }}/${{ inputs.app }}
        tags: ${{ inputs.tags }}

    - uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ steps.dockerfile.outputs.path }}
        push: ${{ inputs.push == 'true' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          TURBO_TOKEN=${{ inputs.turbo-token }}
          TURBO_TEAM=${{ inputs.turbo-team }}
        cache-from: type=gha,scope=${{ inputs.app }}
        cache-to: type=gha,mode=max,scope=${{ inputs.app }}
