name: Release

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      bump:
        required: true
        default: minor
        type: choice
        options: [major, minor, patch]

env:
  REGISTRY: ghcr.io
  OWNER_NAME: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve target commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Calculate release tag
        id: version
        run: |
          git fetch --tags origin
          TAG="$(bash .github/scripts/next-release-tag.sh "${{ inputs.bump }}")"

          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push - ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: prepare

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: [api, scheduler, worker, integration, web-user, web-admin, migrator]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - uses: ./.github/actions/docker-build-push
        with:
          app: ${{ matrix.app }}
          registry: ${{ env.REGISTRY }}
          owner: ${{ env.OWNER_NAME }}
          repo: ${{ env.REPO_NAME }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=${{ needs.prepare.outputs.tag }}
          turbo-token: ${{ env.TURBO_TOKEN }}
          turbo-team: ${{ env.TURBO_TEAM }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    environment: production

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0

      - name: Create Git tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit }}
        run: |
          git fetch --tags origin

          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$TAG" "$COMMIT_SHA"
          git push origin "$TAG"

      - name: Write release manifest
        env:
          REGISTRY: ${{ env.REGISTRY }}
          OWNER_NAME: ${{ env.OWNER_NAME }}
          REPO_NAME: ${{ env.REPO_NAME }}
          GITHUB_SHA: ${{ needs.prepare.outputs.commit }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: bash .github/scripts/write-release-manifest.sh "$TAG" release-manifest.yml

      - name: Pack deploy artifact
        run: bash .github/scripts/pack-deploy-artifact.sh production deploy-artifact.tar.gz release-manifest.yml

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --target "${{ needs.prepare.outputs.commit }}" \
            --notes "Release $TAG from ${{ needs.prepare.outputs.commit }}" \
            release-manifest.yml \
            deploy-artifact.tar.gz
