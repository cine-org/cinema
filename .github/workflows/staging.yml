name: Staging

permissions:
  contents: read

concurrency:
  group: staging
  cancel-in-progress: false

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      deploy_mode:
        required: true
        default: changed
        type: choice
        options: [changed, all]

env:
  REGISTRY: ghcr.io
  OWNER_NAME: ${{ github.repository_owner }}
  REPO_NAME: ${{ github.event.repository.name }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM || vars.TURBO_TEAM }}
  DEPLOY_ROOT: /opt/cinema
  ENV_DIR: /etc/cinema/env

jobs:
  detect:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.bootstrap.outputs.images || steps.detect.outputs.apps }}
      deploy_apps: ${{ steps.bootstrap.outputs.deploy_apps || steps.deploy.outputs.apps }}
      image_tag: ${{ steps.image-tag.outputs.value }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve image tag
        id: image-tag
        run: echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-node-pnpm
        if: github.event_name != 'workflow_dispatch' || inputs.deploy_mode != 'all'
        with:
          install: 'true'

      - name: Bootstrap all apps
        id: bootstrap
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_mode == 'all'
        run: |
          echo 'images=["api","scheduler","worker","integration","web-user","web-admin","migrator"]' >> "$GITHUB_OUTPUT"
          echo 'deploy_apps=all' >> "$GITHUB_OUTPUT"

      - name: Detect changes
        id: detect
        if: github.event_name != 'workflow_dispatch' || inputs.deploy_mode != 'all'
        run: |
          BASE="${{ github.event.before }}"
          if [[ -z "$BASE" ]]; then
            BASE="HEAD~1"
          fi
          echo "Using base ref: $BASE"
          bash .github/scripts/detect-changes.sh "$BASE"

      - name: Resolve deploy apps
        id: deploy
        if: github.event_name != 'workflow_dispatch' || inputs.deploy_mode != 'all'
        run: |
          images='${{ steps.detect.outputs.apps }}'
          base='${{ steps.detect.outputs.base }}'
          apps="$(echo "$images" | jq -r '[.[] | select(. != "migrator")] | join(" ")')"
          changed_files="$(git diff --name-only "$base"...HEAD 2>/dev/null || git diff --name-only "$base" 2>/dev/null || true)"

          if [[ -z "$apps" ]] && echo "$images" | jq -e 'index("migrator")' >/dev/null; then
            apps="api"
          fi

          infra_apps=""

          if echo "$changed_files" | grep -Eq '^(infrastructure/nginx/|infrastructure/docker/infra/nginx\.yml|infrastructure/scripts/deploy-staging\.sh)'; then
            infra_apps="api web-user web-admin nginx"
          fi

          if echo "$changed_files" | grep -Eq '^(infrastructure/docker/compose\.yml|infrastructure/docker/compose\.staging\.yml|infrastructure/docker/services/|infrastructure/docker/infra/)'; then
            infra_apps="api scheduler worker integration web-user web-admin nginx"
          fi

          apps="$(printf '%s\n%s\n' "$apps" "$infra_apps" | xargs -n1 2>/dev/null | awk '!seen[$0]++' | xargs 2>/dev/null || true)"

          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    name: Build & Push - ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.images != '[]'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.detect.outputs.images) }}

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-build-push
        with:
          app: ${{ matrix.app }}
          registry: ${{ env.REGISTRY }}
          owner: ${{ env.OWNER_NAME }}
          repo: ${{ env.REPO_NAME }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            type=raw,value=${{ needs.detect.outputs.image_tag }}
            type=raw,value=latest
          turbo-token: ${{ env.TURBO_TOKEN }}
          turbo-team: ${{ env.TURBO_TEAM }}

  deploy:
    name: Deploy changed apps
    runs-on: ubuntu-latest
    needs: [detect, build]
    if: always() && needs.detect.outputs.deploy_apps != '' && (needs.build.result == 'success' || needs.build.result == 'skipped')
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Pack deploy artifact
        id: artifact
        run: |
          RELEASE_ID="${{ needs.detect.outputs.image_tag }}"
          bash .github/scripts/pack-deploy-artifact.sh staging deploy-artifact.tar.gz
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Upload deploy artifact
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: deploy-artifact.tar.gz
          target: /tmp/cinema-deploy/${{ steps.artifact.outputs.release_id }}

      - name: Deploy via artifact
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command_timeout: 30m
          script: |
            export GHCR_USER="${{ secrets.GHCR_USER || vars.GHCR_USER }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
            export REGISTRY="${{ env.REGISTRY }}"
            export OWNER_NAME="${{ env.OWNER_NAME }}"
            export REPO_NAME="${{ env.REPO_NAME }}"
            export DEPLOY_ROOT="${{ env.DEPLOY_ROOT }}"
            export APP_DIR="${{ env.DEPLOY_ROOT }}/current"
            export ENV_DIR="${{ env.ENV_DIR }}"
            export IMAGE_TAG="${{ needs.detect.outputs.image_tag }}"

            RELEASE_ID="${{ steps.artifact.outputs.release_id }}"
            RELEASE_DIR="$DEPLOY_ROOT/releases/$RELEASE_ID"
            ARTIFACT_PATH="/tmp/cinema-deploy/$RELEASE_ID/deploy-artifact.tar.gz"

            rm -rf "$RELEASE_DIR"
            mkdir -p "$RELEASE_DIR"
            tar -xzf "$ARTIFACT_PATH" -C "$RELEASE_DIR"
            ln -sfnT "$RELEASE_DIR" "$DEPLOY_ROOT/current"

            bash "$APP_DIR/infrastructure/scripts/deploy-staging.sh" \
              ${{ needs.detect.outputs.deploy_apps }}
