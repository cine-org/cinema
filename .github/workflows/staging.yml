name: Staging

permissions:
  contents: read

# Never cancel a publish in progress. GitHub keeps only the newest pending run behind it.
concurrency:
  group: staging
  cancel-in-progress: false

on:
  push:
    branches: [main]
  # Publishes every app (no base to compare against).
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      images: ${{ steps.changes.outputs.images }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      # `before` is the previous main commit, so only apps touched by this merge are rebuilt.
      - name: Detect changes
        id: changes
        run: bash .github/scripts/detect-changes.sh "${{ github.event.before }}"

      - name: Image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  publish:
    name: publish (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: ./.github/actions/docker-build
        with:
          app: ${{ matrix.app }}
          push: 'true'
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ needs.changes.outputs.tag }}

  # Points cinema-ops at the new tags, then waits until Argo CD reports the rollout healthy.
  promote:
    name: promote
    needs: [changes, publish]
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v2
        id: bot
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cinema-ops

      - uses: ./.github/actions/ops-pr
        with:
          token: ${{ steps.bot.outputs.token }}
          bot-slug: ${{ steps.bot.outputs.app-slug }}
          environment: staging
          tag: ${{ needs.changes.outputs.tag }}
          apps: ${{ needs.changes.outputs.images }}
          merge: 'true'
          wait-rollout: 'true'
