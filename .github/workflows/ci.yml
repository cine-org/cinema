name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
      images: ${{ steps.changes.outputs.images }}
    steps:
      - name: Warn about missing Turbo remote cache
        if: env.TURBO_TOKEN == '' || env.TURBO_TEAM == ''
        run: echo "::warning::TURBO_TOKEN or TURBO_TEAM is missing; CI runs without remote cache."

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - name: Detect changes
        id: changes
        run: bash .github/scripts/detect-changes.sh "${{ github.event.pull_request.base.sha }}"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check

      - name: OpenAPI schema is committed
        run: pnpm openapi:check

      - name: Generate API client
        run: pnpm openapi:generate:types

      - name: Lint
        run: pnpm lint

  test:
    name: test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Create test env
        # Every package that needs test env ships its own `.env.test.example`.
        run: for f in $(git ls-files '*.env.test.example'); do cp "$f" "${f%.example}"; done

      - name: Start test infra
        run: pnpm docker:test:up

      - name: Migrate test database
        run: pnpm db:test:deploy

      - name: Migrations match Prisma schema
        run: pnpm db:test:check

      - name: Unit test
        run: pnpm test

      - name: Integration test
        run: pnpm test:int

      - name: E2E test
        run: pnpm test:e2e

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

  docker:
    name: docker (${{ matrix.app }})
    needs: changes
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-build
        with:
          app: ${{ matrix.app }}

  # The only check the ruleset requires. Skipped jobs count as passed, so docs-only PRs still go green.
  ci:
    name: ci
    needs: [changes, lint, test, build, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
