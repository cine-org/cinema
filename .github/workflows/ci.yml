name: CI

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      quality: ${{ steps.filter.outputs.quality }}
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Detect CI impact
        run: bash .github/scripts/ci-filter.sh "${{ github.event.pull_request.base.sha }}"

  quality:
    name: Lint / Typecheck / Unit
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.quality == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Check Turbo remote cache credentials
        run: |
          if [[ -z "$TURBO_TOKEN" || -z "$TURBO_TEAM" ]]; then
            echo "::warning::Turbo remote cache credentials are missing; quality checks will continue without remote cache."
          else
            echo "Turbo remote cache credentials are configured."
          fi

      - name: Create test env
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cinema_test
          REDIS_URL=redis://localhost:6379
          EOF

      - name: Run quality checks
        run: bash .github/scripts/ci-quality.sh

  integration:
    name: Integration / E2E
    runs-on: ubuntu-latest
    needs: filter
    if: needs.filter.outputs.integration == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cinema_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cinema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-pnpm

      - name: Create test env
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/cinema_test
          REDIS_URL=redis://localhost:6379
          EOF

      - name: Run integration checks
        run: bash .github/scripts/ci-integration.sh
