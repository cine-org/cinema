services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../nginx/mime.types:/etc/nginx/mime.types:ro
      - ../../nginx/templates:/etc/nginx/templates:ro
      - ../../nginx/snippets:/etc/nginx/snippets:ro
      - ssl_certs:/opt/ssl:ro
    env_file:
      - ${ENV_DIR}/nginx.env
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/nginx-health > /dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      web-user:
        condition: service_healthy
      web-admin:
        condition: service_healthy
    networks:
      - cinema
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
