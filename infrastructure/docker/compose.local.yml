# Local dev overlay — builds from source, loads .env + apps/{app}/.env
# Run via: pnpm docker:up  (passes --env-file infrastructure/docker/.env)

services:
  migrator:
    build:
      context: ../..
      dockerfile: packages/database/migrator/Dockerfile
    environment:
      DATABASE_URL: postgresql://${DB_MIGRATOR_USER}:${DB_MIGRATOR_PASSWORD}@postgres:5432/${POSTGRES_DB}

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
    env_file:
      - ../../.env
      - ../../apps/api/.env
    ports:
      - '3000:3000'

  scheduler:
    build:
      context: ../..
      dockerfile: apps/scheduler/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
    env_file:
      - ../../.env
      - ../../apps/scheduler/.env

  worker:
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
    env_file:
      - ../../.env
      - ../../apps/worker/.env

  integration:
    build:
      context: ../..
      dockerfile: apps/integration/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_APP_USER}:${DB_APP_PASSWORD}@pgbouncer:6432/${POSTGRES_DB}
    env_file:
      - ../../.env
      - ../../apps/integration/.env

  web-user:
    build:
      context: ../..
      dockerfile: apps/web-user/Dockerfile
    env_file:
      - ../../apps/web-user/.env
    ports:
      - '4000:80'

  web-admin:
    build:
      context: ../..
      dockerfile: apps/web-admin/Dockerfile
    env_file:
      - ../../apps/web-admin/.env
    ports:
      - '4001:80'

  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'

  pgbouncer:
    ports:
      - '6432:6432'

  redis:
    ports:
      - '6379:6379'
