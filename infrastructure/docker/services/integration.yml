services:
  integration:
    depends_on:
      pgbouncer:
        condition: service_healthy
      db-access-reconciler:
        condition: service_completed_successfully
    networks:
      - cinema
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
