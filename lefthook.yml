pre-commit:
  # Both commands rewrite and re-stage the same files. Running them in parallel
  # can contend on the Git index and leave one command waiting indefinitely.
  parallel: false
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,json,md,yaml,yml,css}'
      run: ./node_modules/.bin/prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js,mjs}'
      run: ./node_modules/.bin/eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    conventional-commits:
      run: ./node_modules/.bin/commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: ./node_modules/.bin/turbo run typecheck --affected
    test:
      run: ./node_modules/.bin/turbo run test --affected
    build:
      run: ./node_modules/.bin/turbo run build --affected
